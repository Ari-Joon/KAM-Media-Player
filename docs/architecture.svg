<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="KAM Media Player architecture: Discord clients, a Node service running the bot and voice player, and a persistent Python analyser joined by the VisualScore contract.">
  <title>KAM Media Player — architecture</title>

  <!-- The diagram carries its own dark background rather than inheriting the
       page's. GitHub serves README images through a proxy and shows them on
       either a light or a dark page; a transparent diagram is legible on one
       and invisible on the other. -->
  <defs>
    <style>
      .panel { fill: #14161c; stroke: #262b36; stroke-width: 1.5; }
      .box   { fill: #1b1e26; stroke: #333a48; stroke-width: 1.5; }
      .gold  { fill: #ffd21a; }
      .h     { font: 600 13px "Segoe UI", Inter, system-ui, sans-serif; fill: #ffd21a;
               letter-spacing: 1.6px; text-transform: uppercase; }
      .t     { font: 500 14px "Segoe UI", Inter, system-ui, sans-serif; fill: #e8edf2; }
      .s     { font: 400 12px "Segoe UI", Inter, system-ui, sans-serif; fill: #8fa3ad; }
      .m     { font: 400 11.5px ui-monospace, "Cascadia Code", Consolas, monospace; fill: #8fa3ad; }
      .flow  { stroke: #4a555c; stroke-width: 1.6; fill: none; }
      .flowg { stroke: #ffd21a; stroke-width: 2; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a555c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffd21a"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#0c0e13"/>

  <text x="48" y="52" class="h">KAM Media Player</text>
  <text x="48" y="80" style="font:600 22px 'Segoe UI',Inter,system-ui,sans-serif; fill:#e8edf2">Architecture</text>
  <text x="48" y="104" class="s">One Node service owns playback and state. One Python worker owns analysis. They meet at a single document.</text>

  <!-- ================= Discord ================= -->
  <rect x="48" y="136" width="300" height="290" rx="10" class="panel"/>
  <text x="72" y="166" class="h">Discord</text>

  <rect x="72" y="184" width="252" height="72" rx="7" class="box"/>
  <text x="88" y="209" class="t">Voice channel</text>
  <text x="88" y="230" class="s">Opus audio, 20 ms packets</text>
  <text x="88" y="247" class="s">Everyone hears one stream</text>

  <rect x="72" y="270" width="252" height="86" rx="7" class="box"/>
  <text x="88" y="295" class="t">Activity (embedded browser)</text>
  <text x="88" y="316" class="s">Sandboxed iframe. No external</text>
  <text x="88" y="333" class="s">images or fonts — all proxied</text>
  <text x="88" y="350" class="m">/api/image</text>

  <rect x="72" y="370" width="252" height="38" rx="7" class="box"/>
  <text x="88" y="394" class="t">Slash commands</text>

  <!-- ================= Node service ================= -->
  <rect x="420" y="136" width="330" height="404" rx="10" class="panel"/>
  <text x="444" y="166" class="h">Node · Express</text>

  <rect x="444" y="184" width="282" height="80" rx="7" class="box"/>
  <text x="460" y="209" class="t">GuildPlayer — voice</text>
  <text x="460" y="230" class="s">Authoritative playback clock</text>
  <text x="460" y="247" class="s">Crossfade &amp; gapless, 0–12 s</text>

  <rect x="444" y="278" width="282" height="80" rx="7" class="box"/>
  <text x="460" y="303" class="t">Queue · decks · playlists</text>
  <text x="460" y="324" class="s">Three parallel queues, history,</text>
  <text x="460" y="341" class="s">favourites, per-member playlists</text>

  <rect x="444" y="372" width="282" height="80" rx="7" class="box"/>
  <text x="460" y="397" class="t">HTTPS API + auth</text>
  <text x="460" y="418" class="s">Every state change verifies the</text>
  <text x="460" y="435" class="s">caller and their voice presence</text>

  <rect x="444" y="466" width="282" height="54" rx="7" class="box"/>
  <text x="460" y="490" class="t">Providers</text>
  <text x="460" y="509" class="s">SoundCloud API · YouTube search</text>

  <!-- ================= Python ================= -->
  <rect x="822" y="136" width="330" height="290" rx="10" class="panel"/>
  <text x="846" y="166" class="h">Python · visualcore</text>

  <rect x="846" y="184" width="282" height="96" rx="7" class="box"/>
  <text x="862" y="209" class="t">Persistent analyser worker</text>
  <text x="862" y="230" class="s">librosa · soundfile · pydantic</text>
  <text x="862" y="251" class="s">Warmed at boot: numba JIT is</text>
  <text x="862" y="268" class="s">not cached between processes</text>

  <rect x="846" y="294" width="282" height="112" rx="7" class="box"/>
  <text x="862" y="319" class="t">Two passes per track</text>
  <text x="862" y="342" class="s">Provisional, first 45 s</text>
  <text x="1090" y="342" class="m" text-anchor="end">0.21 s</text>
  <text x="862" y="365" class="s">Full track</text>
  <text x="1090" y="365" class="m" text-anchor="end">2.5 s</text>
  <text x="862" y="390" class="s">Cached, keyed to analyser version</text>

  <!-- ================= The contract ================= -->
  <rect x="822" y="452" width="330" height="152" rx="10" style="fill:#1a1710; stroke:#7a6512; stroke-width:1.5"/>
  <text x="846" y="482" class="h">VisualScore</text>
  <text x="846" y="506" class="s">The single contract. Everything is</text>
  <text x="846" y="523" class="s">addressable from playback seconds.</text>
  <text x="846" y="548" class="m" style="fill:#ffd21a">lane[int(t * fps)]</text>
  <text x="846" y="570" class="s">Dense 30 fps lanes · 16 spectrum</text>
  <text x="846" y="587" class="s">bands · values 0–1, 3 dp</text>

  <!-- ================= Flows ================= -->
  <!-- Discord voice <- Node -->
  <path d="M 420 224 L 352 224" class="flow" marker-end="url(#a)"/>
  <text x="360" y="212" class="s" text-anchor="end">audio</text>

  <!-- Activity <-> Node API -->
  <path d="M 352 312 L 420 400" class="flow" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="392" y="368" class="s" text-anchor="middle">poll</text>

  <!-- Commands -> Node -->
  <path d="M 324 408 L 420 470" class="flow" marker-end="url(#a)"/>

  <!-- Node -> Python -->
  <path d="M 750 232 L 822 232" class="flow" marker-end="url(#a)"/>
  <text x="786" y="220" class="s" text-anchor="middle">file</text>

  <!-- Python -> score -->
  <path d="M 987 406 L 987 452" class="flowg" marker-end="url(#ag)"/>

  <!-- score -> Node -->
  <path d="M 822 528 L 750 528" class="flowg" marker-end="url(#ag)"/>

  <!-- Node -> Activity (score fetched separately, once per scoreId) -->
  <path d="M 444 528 L 300 528 L 300 424" class="flowg" marker-end="url(#ag)"/>
  <text x="300" y="548" class="s" text-anchor="middle">fetched once per score, never in the 1 s poll</text>

  <!-- ================= Footer note ================= -->
  <text x="48" y="452" class="s">18 visualisations, all Canvas2D.</text>
  <text x="48" y="472" class="s">There is no WebGL path — removing</text>
  <text x="48" y="492" class="s">it fixed more than it cost.</text>

  <text x="48" y="628" class="m">Self-hosted. See MEDIA_POLICY.md — there is no free licensed path to audio.</text>
</svg>
